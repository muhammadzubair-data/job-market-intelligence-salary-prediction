name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit & integration tests
        run: python -m pytest -q
      - name: Train models from the CLI
        run: python scripts/train.py --output artifacts
      - name: Upload evaluation artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation
          path: |
            artifacts/*.json
            artifacts/*.csv

  e2e:
    name: Browser end-to-end test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Start dashboard
        run: |
          nohup streamlit run app.py --server.port 8501 > streamlit.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8501/_stcore/health && break; sleep 2; done
      - name: Run end-to-end checks
        run: python tests/e2e_ui.py http://localhost:8501
      - name: Server log
        if: always()
        run: cat streamlit.log
